<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Trivandrum Traffic Navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mapbox/polyline@1.2.1/src/polyline.js"></script>
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-page: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #cbd5e1;
            --card-border: #e2e8f0;
            --card-active-bg: #f8faff;
            --card-active-border: #2563eb;
            --legend-bg: rgba(255, 255, 255, 0.9);
            --btn-sec-bg: #f8fafc;
            --btn-sec-hover: #f1f5f9;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.12);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.12);
        }

        body.dark-mode {
            --bg-page: #090d16;
            --bg-sidebar: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --card-border: #334155;
            --card-active-bg: #1e293b;
            --card-active-border: #3b82f6;
            --legend-bg: rgba(15, 23, 42, 0.88);
            --btn-sec-bg: #1e293b;
            --btn-sec-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 12px 30px -4px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            font-family: var(--font-main);
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg-page);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
        }

        #sidebar {
            width: 450px;
            height: 100%;
            background: var(--bg-sidebar);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.06);
            z-index: 20;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease, border-color 0.3s ease;
        }

        .drawer-top-sticky {
            padding: 24px 24px 0 24px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
        }

        .drawer-handle-area {
            display: none;
        }

        #drawer-scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px 24px;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        #drawer-scroll-content::-webkit-scrollbar {
            width: 6px;
        }

        #drawer-scroll-content::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        #map-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 17px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .brand-title h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            line-height: 1.25;
        }

        .theme-toggle-btn {
            background: var(--btn-sec-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 7px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--btn-sec-hover);
            transform: translateY(-1px);
        }

        /* Inputs & Autocomplete */
        .input-group {
            margin-bottom: 14px;
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }

        .autocomplete-container {
            width: 100%;
            margin-bottom: 6px;
        }

        /* Light Mode Autocomplete Dropdown */
        gmp-place-autocomplete,
        .autocomplete-container gmp-place-autocomplete {
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            border: 1.5px solid var(--border-color);
            box-sizing: border-box;
            display: block;
            transition: border-color 0.2s, box-shadow 0.2s;

            color-scheme: light !important;
            background-color: #ffffff !important;
            --gmp-mat-sys-color-surface: #ffffff;
            --gmp-mat-sys-color-surface-container: #ffffff;
            --gmp-mat-sys-color-surface-container-high: #ffffff;
            --gmp-mat-sys-color-surface-container-highest: #f8fafc;
            --gmp-mat-sys-color-surface-variant: #ffffff;

            color: #0f172a !important;
            --gmp-mat-sys-color-on-surface: #0f172a;
            --gmp-mat-sys-color-on-surface-variant: #475569;
            --gmp-mat-sys-color-outline: transparent;
            --gmp-mat-sys-color-primary: #2563eb;
        }

        gmp-place-autocomplete:focus-within,
        .autocomplete-container gmp-place-autocomplete:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Dark Mode Autocomplete Dropdown */
        body.dark-mode gmp-place-autocomplete,
        body.dark-mode .autocomplete-container gmp-place-autocomplete {
            color-scheme: dark !important;
            border-color: #334155;
            background-color: #1e293b !important;
            --gmp-mat-sys-color-surface: #1e293b;
            --gmp-mat-sys-color-surface-container: #1e293b;
            --gmp-mat-sys-color-surface-container-high: #1e293b;
            --gmp-mat-sys-color-surface-container-highest: #334155;
            --gmp-mat-sys-color-surface-variant: #1e293b;

            color: #f8fafc !important;
            --gmp-mat-sys-color-on-surface: #f8fafc;
            --gmp-mat-sys-color-on-surface-variant: #cbd5e1;
            --gmp-mat-sys-color-primary: #60a5fa;
        }

        .autocomplete-container input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 16px;
            border: 1.5px solid var(--border-color);
            background-color: #ffffff;
            color: #0f172a !important;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        body.dark-mode .autocomplete-container input[type="text"] {
            background-color: #1e293b;
            color: #f8fafc !important;
            border-color: #334155;
        }

        .autocomplete-container input[type="text"]::placeholder {
            color: #94a3b8;
        }

        .pac-container {
            background-color: #ffffff !important;
            font-family: var(--font-main) !important;
            border-radius: 10px !important;
            border: 1.5px solid var(--border-color) !important;
            box-shadow: var(--shadow-lg) !important;
            z-index: 9999 !important;
        }

        .pac-item {
            padding: 11px 14px !important;
            font-size: 13.5px !important;
            color: #334155 !important;
            border-top: 1px solid #f1f5f9 !important;
            cursor: pointer !important;
        }

        .pac-item:hover {
            background-color: #f1f5f9 !important;
        }

        .pac-item-query {
            font-size: 14px !important;
            font-weight: 700 !important;
            color: #0f172a !important;
        }

        .pac-matched {
            color: #2563eb !important;
            font-weight: 800 !important;
        }

        body.dark-mode .pac-container {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-mode .pac-item {
            color: #cbd5e1 !important;
            border-top: 1px solid #334155 !important;
        }

        body.dark-mode .pac-item:hover {
            background-color: #334155 !important;
        }

        body.dark-mode .pac-item-query {
            color: #f8fafc !important;
        }

        body.dark-mode .pac-matched {
            color: #60a5fa !important;
        }

        /* Buttons */
        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, var(--primary-hover), #2563eb);
            transform: translateY(-1.5px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: var(--btn-sec-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 42px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--btn-sec-hover);
            border-color: var(--text-muted);
        }

        /* Range Slider Styling */
        .slider-card {
            background: var(--btn-sec-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 4px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .time-badge {
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .sim-date-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            touch-action: pan-y;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            border: 2.5px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* POI Toolbar */
        .poi-toolbar {
            display: flex;
            gap: 8px;
            margin: 8px 0 14px 0;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .poi-toolbar::-webkit-scrollbar {
            height: 4px;
        }

        .poi-btn {
            padding: 8px 13px;
            background: var(--btn-sec-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .poi-btn:hover {
            background: var(--btn-sec-hover);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Route Cards */
        .route-card {
            border: 1.5px solid var(--card-border);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .route-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: transparent;
            transition: background 0.2s;
        }

        .route-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--card-active-border);
        }

        .route-card.active {
            border-color: var(--card-active-border);
            background: var(--card-active-bg);
            box-shadow: var(--shadow-md);
        }

        .route-card.active::before {
            background: var(--card-active-border);
        }

        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .eta-display {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .eta-display strong {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        .metrics-text {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        /* Glassmorphism Legend */
        .legend {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: var(--legend-bg);
            color: var(--text-primary);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            font-size: 13px;
            z-index: 5;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .legend-title {
            font-size: 11.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .legend-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .legend-badge-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 8px currentColor;
        }

        .legend-subtext {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--btn-sec-bg);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-family: monospace;
        }

        /* =========================================================
           GOOGLE MAPS-STYLE BOTTOM SHEET DRAWER FOR MOBILE PHONES
           ========================================================= */
        @media (max-width: 768px) {

            html,
            body {
                overflow: hidden;
                position: fixed;
                inset: 0;
            }

            /* Fullscreen locked map in background */
            #map-wrapper {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            /* Floating bottom sheet drawer */
            #sidebar {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 76vh;
                height: 76dvh;
                max-height: calc(100dvh - 54px);
                border-right: none;
                border-top: 1px solid var(--border-color);
                border-radius: 22px 22px 0 0;
                box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.22);
                z-index: 30;
                transform: translateY(0);
            }

            /* Collapsed state: leaves only pill handle and full title visible */
            #sidebar.collapsed {
                transform: translateY(calc(100% - 76px));
            }

            .drawer-top-sticky {
                padding: 8px 16px 0 16px;
                border-radius: 22px 22px 0 0;
                user-select: none;
            }

            .drawer-handle-area {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 6px 0 10px 0;
                cursor: pointer;
            }

            .drawer-pill {
                width: 44px;
                height: 5px;
                border-radius: 999px;
                background: var(--border-color);
                transition: background-color 0.2s ease, width 0.2s ease;
            }

            .drawer-handle-area:active .drawer-pill {
                background: var(--primary);
                width: 54px;
            }

            #drawer-scroll-content {
                padding: 4px 16px 36px 16px;
            }

            .header-bar {
                margin-bottom: 12px;
                padding-bottom: 12px;
            }

            #sidebar.collapsed .header-bar {
                border-bottom-color: transparent;
                margin-bottom: 0;
            }

            .brand-icon {
                width: 28px;
                height: 28px;
                font-size: 15px;
            }

            .brand-title h2 {
                font-size: 15px;
                white-space: nowrap;
                overflow: visible;
            }

            .theme-toggle-btn {
                padding: 6px 10px;
                font-size: 11.5px;
            }

            input[type=range]::-webkit-slider-thumb {
                height: 24px;
                width: 24px;
                margin-top: -9px;
            }

            /* Move Legend to top-left so bottom sheet doesn't block it */
            .legend {
                top: 12px;
                left: 12px;
                bottom: auto;
                padding: 9px 12px;
                border-radius: 12px;
                min-width: auto;
                box-shadow: var(--shadow-md);
            }

            .legend-title {
                font-size: 9.5px;
                margin-bottom: 5px;
            }

            .legend-list {
                gap: 4px;
            }

            .legend-row {
                gap: 8px;
            }

            .legend-left {
                font-size: 11px;
                gap: 6px;
            }

            .legend-badge-dot {
                width: 8px;
                height: 8px;
            }

            .legend-subtext {
                font-size: 9.5px;
                padding: 1px 5px;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="drawer-top-sticky">
            <div class="drawer-handle-area" onclick="toggleDrawer()" title="Tap or swipe to hide/show menu">
                <div class="drawer-pill"></div>
            </div>
            <div class="header-bar">
                <div class="brand-title" onclick="if(window.innerWidth <= 768) toggleDrawer()" style="cursor: pointer;">
                    <div class="brand-icon">🧭</div>
                    <h2>Trivandrum Traffic Navigator</h2>
                </div>
                <button class="theme-toggle-btn" id="theme-btn" onclick="toggleDarkMode()">🌙 Dark</button>
            </div>
        </div>

        <div id="drawer-scroll-content">
            <div class="input-group">
                <span class="label">Starting Point</span>
                <div id="origin-autocomplete-box" class="autocomplete-container"></div>
            </div>
            <button class="btn-secondary" onclick="locateUser()">
                <span>📍</span> Locate My Device
            </button>

            <div class="input-group">
                <span class="label">Destination</span>
                <div id="dest-autocomplete-box" class="autocomplete-container"></div>
            </div>

            <!-- Simulated Time Card -->
            <div class="input-group">
                <span class="label">24-Hour Simulation Engine</span>
                <div class="slider-card">
                    <div class="slider-header">
                        <span class="sim-date-badge" id="sim-date-badge">Simulating for Today</span>
                        <span class="time-badge" id="time-display">08:00 AM</span>
                    </div>
                    <input id="time-slider" type="range" min="0" max="23.5" step="0.5" value="8"
                        oninput="updateTimeDisplay()" onchange="handleSliderChange()" />
                </div>
            </div>

            <button class="btn-action" onclick="fetchRoutes()">
                <span>⚡</span> Search Optimal Routes
            </button>

            <!-- Along-Route Discovery Bar -->
            <div style="margin-top: 18px;">
                <span class="label">Places Along Route (Places API)</span>
                <div class="poi-toolbar">
                    <button class="poi-btn" onclick="searchPOIsAlongRoute('electric_vehicle_charging_station')">⚡ EV
                        Chargers</button>
                    <button class="poi-btn" onclick="searchPOIsAlongRoute('parking')">🅿️ Parking</button>
                    <button class="poi-btn" onclick="searchPOIsAlongRoute('gas_station')">⛽ Fuel Pumps</button>
                    <button class="poi-btn" onclick="searchPOIsAlongRoute('cafe')">☕ Cafes</button>
                </div>
            </div>

            <!-- Community Incident Reporting -->
            <div style="margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <span class="label">Community Reporting</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary"
                        style="background:rgba(239, 68, 68, 0.08); color:#ef4444; border-color:rgba(239, 68, 68, 0.25);"
                        onclick="reportRoadIssue('heavy_traffic')">⚠️ Report Jam</button>
                    <button class="btn-secondary"
                        style="background:rgba(59, 130, 246, 0.08); color:#3b82f6; border-color:rgba(59, 130, 246, 0.25);"
                        onclick="reportRoadIssue('waterlogging')">🌧️ Waterlogging</button>
                </div>
            </div>

            <div id="routes-container" style="margin-top: 8px;"></div>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
        <!-- Traffic Severity Legend with Percentage Densities -->
        <div class="legend">
            <div class="legend-title">
                <span>Traffic Severity</span>
            </div>
            <div class="legend-list">
                <div class="legend-row">
                    <div class="legend-left">
                        <span class="legend-badge-dot" style="background: #1E88E5; color: #1E88E5;"></span>
                        <span>Free Flow</span>
                    </div>
                    <span class="legend-subtext">&lt; 50%</span>
                </div>
                <div class="legend-row">
                    <div class="legend-left">
                        <span class="legend-badge-dot" style="background: #FB8C00; color: #FB8C00;"></span>
                        <span>Moderate</span>
                    </div>
                    <span class="legend-subtext">50% – 85%</span>
                </div>
                <div class="legend-row">
                    <div class="legend-left">
                        <span class="legend-badge-dot" style="background: #D32F2F; color: #D32F2F;"></span>
                        <span>Heavy Jam</span>
                    </div>
                    <span class="legend-subtext">&gt; 85%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let originCoord = null;
        let destCoord = null;
        let routePolylines = [];
        let poiMarkers = [];
        let incidentMarkers = [];
        let activeRoutes = [];
        let selectedRouteIndex = 0;
        let originMarker = null;
        let destMarker = null;
        let isDarkMode = false;
        let isDrawerCollapsed = false;
        let sliderDebounceTimeout = null;

        let routeInfoWindow = null;

        let AdvancedMarkerElement = null;
        let PinElement = null;

        const TVM_CENTER = { lat: 8.5241, lng: 76.9366 };
        const isTouchDevice = () => window.matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window);

        const DARK_MAP_STYLE = [
            { elementType: "geometry", stylers: [{ color: "#1e293b" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#1e293b" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#94a3b8" }] },
            { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#cbd5e1" }] },
            { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#94a3b8" }] },
            { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#0f172a" }] },
            { featureType: "road", elementType: "geometry", stylers: [{ color: "#334155" }] },
            { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#1e293b" }] },
            { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#cbd5e1" }] },
            { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#475569" }] },
            { featureType: "water", elementType: "geometry", stylers: [{ color: "#090d16" }] }
        ];

        function toggleDrawer(forceCollapse = null) {
            const sidebar = document.getElementById("sidebar");
            isDrawerCollapsed = forceCollapse !== null ? forceCollapse : !isDrawerCollapsed;
            sidebar.classList.toggle("collapsed", isDrawerCollapsed);
        }

        function setupDrawerSwipe() {
            const topArea = document.querySelector(".drawer-top-sticky");
            let touchStartY = 0;

            topArea.addEventListener("touchstart", (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            topArea.addEventListener("touchend", (e) => {
                const deltaY = e.changedTouches[0].clientY - touchStartY;
                if (deltaY > 30 && !isDrawerCollapsed) {
                    toggleDrawer(true);
                } else if (deltaY < -30 && isDrawerCollapsed) {
                    toggleDrawer(false);
                }
            }, { passive: true });
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle("dark-mode", isDarkMode);
            document.getElementById("theme-btn").innerText = isDarkMode ? "☀️ Light" : "🌙 Dark";
            if (map) {
                map.setOptions({ styles: isDarkMode ? DARK_MAP_STYLE : [] });
            }
        }

        async function initApp() {
            try {
                setupDrawerSwipe();
                const { Map } = await google.maps.importLibrary("maps");
                const placesLib = await google.maps.importLibrary("places");

                try {
                    const markerLib = await google.maps.importLibrary("marker");
                    AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
                    PinElement = markerLib.PinElement;
                } catch (mErr) {
                    console.warn("Advanced markers fallback to default", mErr);
                }

                map = new Map(document.getElementById("map"), {
                    center: TVM_CENTER,
                    zoom: 12,
                    mapId: "DEMO_MAP_ID",
                    mapTypeControl: false,
                    fullscreenControl: false,
                    gestureHandling: "greedy"
                });

                routeInfoWindow = new google.maps.InfoWindow({
                    disableAutoPan: true
                });

                map.addListener("click", () => {
                    if (routeInfoWindow) routeInfoWindow.close();
                });

                setupPlacesAutocomplete(placesLib);
                loadIncidentMarkers();
                updateTimeDisplay();
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        function setupPlacesAutocomplete(placesLib) {
            const bounds = new google.maps.LatLngBounds(
                { lat: 8.2, lng: 76.7 },
                { lat: 8.8, lng: 77.2 }
            );

            const originBox = document.getElementById("origin-autocomplete-box");
            const destBox = document.getElementById("dest-autocomplete-box");
            originBox.innerHTML = "";
            destBox.innerHTML = "";

            if (placesLib.PlaceAutocompleteElement) {
                const originAutocomplete = new placesLib.PlaceAutocompleteElement({
                    locationRestriction: bounds,
                    componentRestrictions: { country: "in" }
                });
                originAutocomplete.placeholder = "Search origin (e.g. East Fort)";
                originAutocomplete.setAttribute("placeholder", "Search origin (e.g. East Fort)");
                originAutocomplete.id = "origin-place-element";
                originBox.appendChild(originAutocomplete);

                const handleOriginSelect = async (placePrediction) => {
                    if (!placePrediction) return;
                    const place = placePrediction.toPlace ? placePrediction.toPlace() : placePrediction;
                    await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
                    if (place.location) {
                        originCoord = { lat: place.location.lat(), lng: place.location.lng() };
                        placeMarker("origin", originCoord, place.displayName || "Origin");
                        map.panTo(originCoord);
                    }
                };

                originAutocomplete.addEventListener("gmp-placeselect", (e) => handleOriginSelect(e.placePrediction || e.place));
                originAutocomplete.addEventListener("gmp-select", (e) => handleOriginSelect(e.placePrediction || e.place));

                const destAutocomplete = new placesLib.PlaceAutocompleteElement({
                    locationRestriction: bounds,
                    componentRestrictions: { country: "in" }
                });
                destAutocomplete.placeholder = "Search destination (e.g. Technopark)";
                destAutocomplete.setAttribute("placeholder", "Search destination (e.g. Technopark)");
                destAutocomplete.id = "dest-place-element";
                destBox.appendChild(destAutocomplete);

                const handleDestSelect = async (placePrediction) => {
                    if (!placePrediction) return;
                    const place = placePrediction.toPlace ? placePrediction.toPlace() : placePrediction;
                    await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
                    if (place.location) {
                        destCoord = { lat: place.location.lat(), lng: place.location.lng() };
                        placeMarker("dest", destCoord, place.displayName || "Destination");
                        if (originCoord) fetchRoutes();
                        else map.panTo(destCoord);
                    }
                };

                destAutocomplete.addEventListener("gmp-placeselect", (e) => handleDestSelect(e.placePrediction || e.place));
                destAutocomplete.addEventListener("gmp-select", (e) => handleDestSelect(e.placePrediction || e.place));
            } else {
                const originInput = document.createElement("input");
                originInput.type = "text";
                originInput.id = "origin-input";
                originInput.placeholder = "Search origin (e.g. East Fort)";
                originBox.appendChild(originInput);

                const originAc = new google.maps.places.Autocomplete(originInput, {
                    bounds: bounds,
                    componentRestrictions: { country: "in" }
                });
                originAc.addListener("place_changed", () => {
                    const p = originAc.getPlace();
                    if (p && p.geometry) {
                        originCoord = { lat: p.geometry.location.lat(), lng: p.geometry.location.lng() };
                        placeMarker("origin", originCoord, p.name || "Origin");
                        map.panTo(originCoord);
                    }
                });

                const destInput = document.createElement("input");
                destInput.type = "text";
                destInput.id = "dest-input";
                destInput.placeholder = "Search destination (e.g. Technopark)";
                destBox.appendChild(destInput);

                const destAc = new google.maps.places.Autocomplete(destInput, {
                    bounds: bounds,
                    componentRestrictions: { country: "in" }
                });
                destAc.addListener("place_changed", () => {
                    const p = destAc.getPlace();
                    if (p && p.geometry) {
                        destCoord = { lat: p.geometry.location.lat(), lng: p.geometry.location.lng() };
                        placeMarker("dest", destCoord, p.name || "Destination");
                        if (originCoord) fetchRoutes();
                        else map.panTo(destCoord);
                    }
                });
            }
        }

        function placeMarker(type, coord, title) {
            if (type === "origin") {
                if (originMarker) originMarker.map = null;
                if (AdvancedMarkerElement && PinElement) {
                    const pin = new PinElement({ background: "#2563eb", glyphColor: "#ffffff" });
                    originMarker = new AdvancedMarkerElement({ map, position: coord, title, content: pin.element });
                } else {
                    originMarker = new google.maps.Marker({ map, position: coord, title });
                }
            } else {
                if (destMarker) destMarker.map = null;
                if (AdvancedMarkerElement && PinElement) {
                    const pin = new PinElement({ background: "#10b981", glyphColor: "#ffffff" });
                    destMarker = new AdvancedMarkerElement({ map, position: coord, title, content: pin.element });
                } else {
                    destMarker = new google.maps.Marker({ map, position: coord, title });
                }
            }
        }

        async function locateUser() {
            if (!navigator.geolocation) {
                return alert("Geolocation is not supported by your browser.");
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                originCoord = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                map.panTo(originCoord);

                let placeTitle = "Current Location";

                try {
                    const geocoder = new google.maps.Geocoder();
                    const res = await geocoder.geocode({ location: originCoord });
                    if (res.results && res.results[0]) {
                        placeTitle = res.results[0].formatted_address;
                    }
                } catch (e) {
                    console.warn("Geocoder lookup error:", e);
                    placeTitle = `Location (${originCoord.lat.toFixed(4)}, ${originCoord.lng.toFixed(4)})`;
                }

                placeMarker("origin", originCoord, placeTitle);

                const originBox = document.getElementById("origin-autocomplete-box");
                const customElement = originBox.querySelector("gmp-place-autocomplete");
                const normalInput = originBox.querySelector("input");

                if (customElement) {
                    const shadowInput = customElement.shadowRoot ? customElement.shadowRoot.querySelector("input") : null;
                    if (shadowInput) {
                        shadowInput.value = placeTitle;
                        shadowInput.dispatchEvent(new Event("input", { bubbles: true }));
                    } else {
                        customElement.setAttribute("value", placeTitle);
                    }
                } else if (normalInput) {
                    normalInput.value = placeTitle;
                }

                if (destCoord) {
                    fetchRoutes();
                }
            }, (err) => {
                alert("Could not fetch device coordinates: " + err.message);
            }, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        }

        function getSimulatedDateTime() {
            const val = parseFloat(document.getElementById("time-slider").value);
            const hours = Math.floor(val);
            const mins = val % 1 !== 0 ? 30 : 0;

            const targetDate = new Date();
            if (hours < targetDate.getHours() || (hours === targetDate.getHours() && mins <= targetDate.getMinutes())) {
                targetDate.setDate(targetDate.getDate() + 1);
            }
            targetDate.setHours(hours, mins, 0, 0);

            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            const isoStr = `${year}-${month}-${day}T${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:00`;

            return { targetDate, isoStr };
        }

        function updateTimeDisplay() {
            const val = parseFloat(document.getElementById("time-slider").value);
            let hours = Math.floor(val);
            let mins = val % 1 !== 0 ? "30" : "00";
            let ampm = hours >= 12 ? "PM" : "AM";
            let displayHours = hours % 12;
            if (displayHours === 0) displayHours = 12;
            document.getElementById("time-display").innerText =
                `${displayHours < 10 ? '0' : ''}${displayHours}:${mins} ${ampm}`;

            const { targetDate } = getSimulatedDateTime();
            const isTomorrow = targetDate.getDate() !== (new Date()).getDate();
            const dateBadge = document.getElementById("sim-date-badge");
            if (dateBadge) {
                dateBadge.innerText = isTomorrow ? "Simulating for Tomorrow" : "Simulating for Today";
            }
        }

        function handleSliderChange() {
            updateTimeDisplay();
            clearTimeout(sliderDebounceTimeout);
            sliderDebounceTimeout = setTimeout(() => {
                fetchRoutes();
            }, 300);
        }

        async function fetchRoutes() {
            if (!originCoord || !destCoord) {
                originCoord = { lat: 8.4835, lng: 76.9488 }; // East Fort
                destCoord = { lat: 8.5581, lng: 76.8816 };   // Technopark
                placeMarker("origin", originCoord, "East Fort");
                placeMarker("dest", destCoord, "Technopark");
            }

            const { isoStr } = getSimulatedDateTime();

            try {
                const res = await fetch("/api/get-routes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        origin_lat: originCoord.lat,
                        origin_lng: originCoord.lng,
                        dest_lat: destCoord.lat,
                        dest_lng: destCoord.lng,
                        departure_time: isoStr
                    })
                });

                const data = await res.json();
                if (!res.ok || data.error) {
                    alert(data.error || `Error ${res.status}`);
                    return;
                }

                activeRoutes = data.routes || [];
                renderRoutes();
                if (activeRoutes.length > 0) {
                    selectRoute(0);
                    const scrollBox = document.getElementById("drawer-scroll-content");
                    const routesContainer = document.getElementById("routes-container");
                    if (window.innerWidth <= 768 && scrollBox && routesContainer) {
                        scrollBox.scrollTo({ top: routesContainer.offsetTop - 12, behavior: "smooth" });
                    }
                }
            } catch (err) {
                console.error("fetchRoutes error:", err);
            }
        }

        function renderRoutes() {
            const listDiv = document.getElementById("routes-container");
            listDiv.innerHTML = "";

            activeRoutes.forEach((r, idx) => {
                const card = document.createElement("div");
                card.className = `route-card ${idx === selectedRouteIndex ? "active" : ""}`;
                card.id = `route-${idx}`;
                card.onclick = () => {
                    selectRoute(idx);
                    if (window.innerWidth <= 768) {
                        toggleDrawer(true);
                    }
                };

                const trafficDensityPct = Math.round((r.v_c_ratio || 0) * 100);

                card.innerHTML = `
                  <div class="route-header">
                    <span>${r.name}</span>
                    <span class="badge" style="background:${r.stroke_color};">
                        ● ${r.severity_label}
                    </span>
                  </div>
                  <div class="eta-display">
                    <strong>${r.predicted_eta_min} min</strong>
                    <span style="color: var(--text-secondary); font-size: 13px;">(${r.distance_km} km)</span>
                  </div>
                  <div class="metrics-text">
                    <span>Baseline: <b>${r.base_eta_min}m</b></span>
                    <span>•</span>
                    <span>Traffic Density: <b style="color: ${r.stroke_color};">${trafficDensityPct}%</b></span>
                  </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function selectRoute(index, preservePopup = false) {
            selectedRouteIndex = index;
            if (!preservePopup && routeInfoWindow) routeInfoWindow.close();
            routePolylines.forEach(p => p.setMap(null));
            routePolylines = [];

            document.querySelectorAll(".route-card").forEach((c, idx) => {
                c.classList.toggle("active", idx === index);
            });

            const bounds = new google.maps.LatLngBounds();
            activeRoutes.forEach((r, idx) => {
                if (idx !== index) drawPath(r, false, bounds, idx);
            });

            if (activeRoutes[index]) {
                drawPath(activeRoutes[index], true, bounds, index);
                if (!preservePopup) {
                    const bottomPad = window.innerWidth <= 768 ? 110 : 40;
                    map.fitBounds(bounds, { top: 80, right: 30, bottom: bottomPad, left: 30 });
                }
            }
        }

        function drawPath(rObj, isSelected, bounds, routeIdx) {
            rObj.segments.forEach(segment => {
                const decoded = polyline.decode(segment.polyline).map(pt => {
                    const loc = { lat: pt[0], lng: pt[1] };
                    bounds.extend(loc);
                    return loc;
                });

                const poly = new google.maps.Polyline({
                    path: decoded,
                    geodesic: true,
                    strokeColor: segment.stroke_color,
                    strokeOpacity: isSelected ? 0.95 : 0.35,
                    strokeWeight: isSelected ? 7 : 5,
                    zIndex: isSelected ? 10 : 1,
                    map: map
                });

                const segmentDensity = Math.round((segment.v_c_ratio || rObj.v_c_ratio || 0) * 100);
                const peakDensity = Math.round((rObj.v_c_ratio || 0) * 100);

                const infoContent = `
                    <div style="font-family: var(--font-main, sans-serif); color: #0f172a; padding: 6px 4px; min-width: 185px;">
                        <div style="font-weight: 700; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">
                            ${rObj.name}
                        </div>
                        <div style="font-size: 13px; line-height: 1.6;">
                            <div>⏱ <b>Travel Time:</b> ${rObj.predicted_eta_min} min</div>
                            <div>📊 <b>Segment Density:</b> <span style="color:${segment.stroke_color}; font-weight:700;">${segmentDensity}%</span></div>
                            <div>🚦 <b>Peak Route Density:</b> ${peakDensity}%</div>
                        </div>
                    </div>
                `;

                if (!isTouchDevice()) {
                    poly.addListener("mouseover", (e) => {
                        if (routeInfoWindow) {
                            routeInfoWindow.setContent(infoContent);
                            routeInfoWindow.setPosition(e.latLng);
                            routeInfoWindow.open(map);
                        }
                    });

                    poly.addListener("mousemove", (e) => {
                        if (routeInfoWindow) {
                            routeInfoWindow.setPosition(e.latLng);
                        }
                    });

                    poly.addListener("mouseout", () => {
                        if (routeInfoWindow) {
                            routeInfoWindow.close();
                        }
                    });
                }

                poly.addListener("click", (e) => {
                    if (isTouchDevice()) {
                        selectRoute(routeIdx, true);
                        if (routeInfoWindow) {
                            routeInfoWindow.setContent(infoContent);
                            routeInfoWindow.setPosition(e.latLng);
                            routeInfoWindow.open(map);
                        }
                    } else {
                        selectRoute(routeIdx);
                    }
                });

                routePolylines.push(poly);
            });
        }

        async function searchPOIsAlongRoute(category) {
            poiMarkers.forEach(m => {
                if (m.setMap) m.setMap(null);
                else m.map = null;
            });
            poiMarkers = [];

            let samplePoints = [];
            if (activeRoutes.length > 0 && activeRoutes[selectedRouteIndex]) {
                const currentRoute = activeRoutes[selectedRouteIndex];
                let allCoords = [];
                currentRoute.segments.forEach(s => {
                    polyline.decode(s.polyline).forEach(p => allCoords.push({ lat: p[0], lng: p[1] }));
                });

                const step = Math.max(1, Math.floor(allCoords.length / 5));
                for (let i = 0; i < allCoords.length; i += step) {
                    samplePoints.push(allCoords[i]);
                }
                if (allCoords.length > 0) samplePoints.push(allCoords[allCoords.length - 1]);
            } else {
                samplePoints = [destCoord || TVM_CENTER];
            }

            try {
                const res = await fetch("/api/places-along-route", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ waypoints: samplePoints, category: category })
                });

                const data = await res.json();
                if (!data.places) return;

                data.places.forEach(p => {
                    const info = new google.maps.InfoWindow({
                        content: `<div style="color:#0f172a; font-family:sans-serif; padding:4px; max-width:220px;"><strong>${p.name}</strong><br><span style="color:#f59e0b;">★ ${p.rating}</span><br><small style="color:#64748b;">${p.address}</small></div>`
                    });

                    let marker;
                    if (AdvancedMarkerElement && PinElement) {
                        const pin = new PinElement({ background: "#f59e0b", glyphColor: "#0f172a" });
                        marker = new AdvancedMarkerElement({
                            map,
                            position: { lat: p.lat, lng: p.lng },
                            title: `${p.name} (★ ${p.rating})`,
                            content: pin.element
                        });
                        marker.addListener("gmp-click", () => info.open({ anchor: marker, map }));
                    } else {
                        marker = new google.maps.Marker({
                            position: { lat: p.lat, lng: p.lng },
                            map,
                            title: `${p.name} (★ ${p.rating})`,
                            icon: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
                        });
                        marker.addListener("click", () => info.open(map, marker));
                    }
                    poiMarkers.push(marker);
                });

                if (window.innerWidth <= 768 && data.places.length > 0) {
                    toggleDrawer(true);
                }
            } catch (err) {
                console.error("searchPOIsAlongRoute error:", err);
            }
        }

        async function reportRoadIssue(issueType) {
            if (!originCoord) return alert("Please select or locate a starting point first.");
            try {
                await fetch("/api/report-incident", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ lat: originCoord.lat, lng: originCoord.lng, type: issueType })
                });
                alert("Thank you! Your traffic incident report has been registered.");
                loadIncidentMarkers();
            } catch (err) {
                console.error("reportRoadIssue error:", err);
            }
        }

        async function loadIncidentMarkers() {
            try {
                const res = await fetch("/api/get-incidents");
                const data = await res.json();
                incidentMarkers.forEach(m => {
                    if (m.setMap) m.setMap(null);
                    else m.map = null;
                });
                incidentMarkers = [];

                (data.incidents || []).forEach(inc => {
                    let marker;
                    if (AdvancedMarkerElement && PinElement) {
                        const pin = new PinElement({ background: "#ef4444", glyphColor: "#ffffff" });
                        marker = new AdvancedMarkerElement({
                            position: { lat: inc.lat, lng: inc.lng },
                            map,
                            title: "User Flagged: " + inc.type,
                            content: pin.element
                        });
                    } else {
